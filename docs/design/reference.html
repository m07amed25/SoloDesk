<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SoloDesk — UI design reference</title>
    <style>
      :root {
        --background: #f5f7fa;
        --foreground: #18212f;
        --surface: #ffffff;
        --surface-subtle: #eef2f7;
        --surface-hover: #e7ecf3;
        --muted: #e9eef5;
        --muted-foreground: #536173;
        --border: #d5dde7;
        --input-border: #77869a;
        --primary: #285bcb;
        --primary-foreground: #ffffff;
        --primary-hover: #214eaf;
        --primary-pressed: #1b4195;
        --secondary: #e9eef5;
        --secondary-foreground: #26364d;
        --accent: #e7eefe;
        --accent-foreground: #214fbd;
        --ring: #285bcb;
        --link: #214fbd;
        --destructive: #ae2e3b;
        --destructive-foreground: #ffffff;
        --destructive-hover: #942532;
        --success: #176843;
        --success-bg: #e6f5ed;
        --warning: #815000;
        --warning-bg: #fff2d4;
        --danger: #a92e3a;
        --danger-bg: #fceaec;
        --info: #2458ad;
        --info-bg: #eaf1ff;
        --neutral-status: #4e5c70;
        --neutral-status-bg: #e9eef5;
        --sidebar: #e9eef5;
        --sidebar-foreground: #26364d;
        --sidebar-accent: #dae5fb;
        --sidebar-accent-foreground: #214fbd;
        --disabled: #e9eef5;
        --disabled-foreground: #657389;
        --selection: #d9e6ff;
        --selection-foreground: #18212f;
        --chart-1: #285bcb;
        --chart-2: #187f69;
        --chart-3: #8652b8;
        --chart-4: #98600a;
        --chart-5: #ad3f60;
        --chart-6: #456f86;
      }
      [data-theme="dark"] {
        --background: #10151d;
        --foreground: #edf2f8;
        --surface: #171e28;
        --surface-subtle: #1d2633;
        --surface-hover: #263244;
        --muted: #253143;
        --muted-foreground: #b1bed0;
        --border: #344156;
        --input-border: #7889a3;
        --primary: #9ebeff;
        --primary-foreground: #101a2a;
        --primary-hover: #b7ceff;
        --primary-pressed: #83a9f0;
        --secondary: #253143;
        --secondary-foreground: #e0e8f4;
        --accent: #263d62;
        --accent-foreground: #c5d8ff;
        --ring: #9ebeff;
        --link: #b7ceff;
        --destructive: #ffacb6;
        --destructive-foreground: #351018;
        --destructive-hover: #ffc1c8;
        --success: #86dfb1;
        --success-bg: #17382b;
        --warning: #f1c674;
        --warning-bg: #3b2d16;
        --danger: #ffadb8;
        --danger-bg: #42232c;
        --info: #adcaff;
        --info-bg: #203652;
        --neutral-status: #c0ccdd;
        --neutral-status-bg: #293548;
        --sidebar: #141d2b;
        --sidebar-foreground: #d8e3f2;
        --sidebar-accent: #263d62;
        --sidebar-accent-foreground: #c5d8ff;
        --disabled: #253143;
        --disabled-foreground: #91a1b8;
        --selection: #345485;
        --selection-foreground: #ffffff;
        --chart-1: #9ebeff;
        --chart-2: #79d5ba;
        --chart-3: #c2a4f2;
        --chart-4: #e6be70;
        --chart-5: #f0a2ba;
        --chart-6: #8cc5df;
      }
      * {
        box-sizing: border-box;
      }
      html {
        font-size: 16px;
        color-scheme: light;
      }
      html[data-theme="dark"] {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font:
          16px/1.625 Inter,
          "Noto Sans Arabic",
          "Segoe UI",
          system-ui,
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a,
      input,
      select {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
      }
      a {
        color: var(--link);
        text-underline-offset: 3px;
      }
      button,
      input,
      select {
        border-radius: 8px;
      }
      button {
        min-height: 44px;
        padding: 10px 16px;
        border: 1px solid var(--input-border);
        background: var(--surface);
        color: var(--foreground);
        font-size: 14px;
        font-weight: 500;
      }
      button:hover:not(:disabled) {
        background: var(--surface-hover);
      }
      button:active:not(:disabled) {
        background: var(--muted);
      }
      button:disabled {
        background: var(--disabled);
        color: var(--disabled-foreground);
        border-color: var(--border);
      }
      :focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
      ::selection {
        background: var(--selection);
        color: var(--selection-foreground);
      }
      input {
        caret-color: var(--primary);
      }
      svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .referencebar {
        padding: 12px 24px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      .referencebar strong {
        font-size: 14px;
      }
      .ref-controls {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-inline-start: auto;
        flex-wrap: wrap;
      }
      .ref-controls label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted-foreground);
      }
      select {
        min-height: 44px;
        padding: 8px 30px 8px 12px;
        color: var(--foreground);
        background: var(--surface);
        border: 1px solid var(--input-border);
      }
      .windowline {
        min-height: 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--sidebar);
        padding: 8px 24px;
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        color: var(--muted-foreground);
      }
      .shell {
        display: grid;
        grid-template-columns: 248px minmax(0, 1fr);
        min-height: calc(100vh - 121px);
      }
      aside {
        padding: 28px 16px 24px;
        background: var(--sidebar);
        color: var(--sidebar-foreground);
        display: flex;
        flex-direction: column;
        border-inline-end: 1px solid var(--border);
      }
      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 0 12px;
        margin-bottom: 28px;
        color: inherit;
        text-decoration: none;
        font-weight: 650;
        font-size: 22px;
        letter-spacing: -0.02em;
      }
      .brandplate {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        padding: 5px;
        border-radius: 8px;
        background: #e9eef5;
        flex-shrink: 0;
      }
      .brand img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .workspace {
        margin: 0 8px 28px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .workspace b {
        font-size: 14px;
        display: block;
      }
      .workspace small {
        font-size: 12px;
        color: var(--muted-foreground);
      }
      nav {
        display: grid;
        gap: 6px;
      }
      nav button {
        display: flex;
        align-items: center;
        gap: 12px;
        background: transparent;
        border: 0;
        width: 100%;
        text-align: start;
        min-height: 48px;
        padding-inline: 16px;
        color: inherit;
      }
      nav button[aria-current="page"] {
        background: var(--sidebar-accent);
        color: var(--sidebar-accent-foreground);
        font-weight: 600;
      }
      nav button:hover {
        background: var(--surface-hover);
      }
      .navbottom {
        margin-top: auto;
        padding-top: 40px;
      }
      .mainwrap {
        min-width: 0;
      }
      .utilities {
        min-height: 64px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 32px;
        background: var(--surface);
      }
      .breadcrumb {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 14px;
        color: var(--muted-foreground);
        flex: 1;
      }
      .breadcrumb b {
        color: var(--foreground);
        font-weight: 500;
      }
      .timer {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 0;
        background: var(--surface-subtle);
        font-variant-numeric: tabular-nums;
      }
      .timer svg {
        color: var(--primary);
      }
      .sync-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted-foreground);
      }
      .avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--muted);
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 600;
      }
      .iconbtn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px;
        min-width: 44px;
      }
      .menu-toggle {
        display: none;
      }
      main {
        padding: 32px;
        max-width: 1696px;
        margin-inline: auto;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 28px;
        line-height: 38px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      h2 {
        font-size: 20px;
        line-height: 30px;
        font-weight: 600;
      }
      h3 {
        font-size: 16px;
        line-height: 26px;
        font-weight: 600;
      }
      .lead {
        margin-top: 8px;
        color: var(--muted-foreground);
        max-width: 70ch;
      }
      .pagehead {
        display: flex;
        align-items: start;
        gap: 24px;
        justify-content: space-between;
        margin-bottom: 32px;
      }
      .primary {
        min-height: 48px;
        background: var(--primary);
        color: var(--primary-foreground);
        border: 0;
        display: inline-flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
      }
      .primary:hover:not(:disabled) {
        background: var(--primary-hover);
      }
      .primary:active:not(:disabled) {
        background: var(--primary-pressed);
      }
      .pagehead button {
        flex-shrink: 0;
      }
      .toolbar {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }
      .search {
        position: relative;
        flex: 1;
        min-width: 200px;
        max-width: 360px;
      }
      .search svg {
        position: absolute;
        inset-inline-start: 12px;
        top: 13px;
        color: var(--muted-foreground);
      }
      input {
        min-height: 44px;
        border: 1px solid var(--input-border);
        background: var(--surface);
        color: var(--foreground);
        padding: 10px 12px;
        width: 100%;
        font-size: 14px;
      }
      .search input {
        padding-inline-start: 40px;
      }
      input::placeholder {
        color: var(--muted-foreground);
        opacity: 1;
      }
      .smalltext {
        font-size: 12px;
        color: var(--muted-foreground);
      }
      .panel {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        overflow: hidden;
      }
      .table-scroll {
        overflow: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        text-align: start;
        font-size: 14px;
        min-width: 700px;
      }
      caption {
        text-align: start;
        font-size: 16px;
        font-weight: 600;
        padding: 24px;
      }
      thead {
        background: var(--surface-subtle);
        color: var(--muted-foreground);
      }
      th {
        font-weight: 500;
        padding: 16px;
        text-align: start;
        white-space: nowrap;
      }
      td {
        padding: 18px 16px;
        min-height: 64px;
        border-top: 1px solid var(--border);
        vertical-align: middle;
      }
      tbody tr:hover {
        background: var(--surface-subtle);
      }
      td strong {
        font-weight: 500;
      }
      td small {
        display: block;
        color: var(--muted-foreground);
        font-size: 12px;
        margin-top: 2px;
      }
      .identity {
        min-width: 230px;
      }
      .numeric {
        font-variant-numeric: tabular-nums;
        text-align: end;
        white-space: nowrap;
      }
      .badge {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        font-size: 12px;
        line-height: 20px;
        padding: 3px 8px;
        border-radius: 6px;
        background: var(--neutral-status-bg);
        color: var(--neutral-status);
        white-space: nowrap;
        font-weight: 500;
      }
      .badge svg {
        height: 14px;
        width: 14px;
      }
      .badge.info {
        background: var(--info-bg);
        color: var(--info);
      }
      .badge.success {
        background: var(--success-bg);
        color: var(--success);
      }
      .badge.warning {
        background: var(--warning-bg);
        color: var(--warning);
      }
      .badge.danger {
        background: var(--danger-bg);
        color: var(--danger);
      }
      .check {
        width: 20px;
        min-height: 20px;
        height: 20px;
        accent-color: var(--primary);
        cursor: pointer;
      }
      .checkwrap {
        display: grid;
        place-items: center;
        min-width: 44px;
        min-height: 44px;
      }
      .row-link {
        border: 0;
        background: transparent;
        padding: 0;
        min-height: 44px;
        text-align: start;
        font-weight: 500;
        color: var(--foreground);
        display: flex;
        align-items: center;
      }
      .row-link:hover {
        color: var(--link);
        background: transparent !important;
        text-decoration: underline;
      }
      .tablefoot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 24px;
        border-top: 1px solid var(--border);
        font-size: 12px;
        color: var(--muted-foreground);
      }
      .banner {
        display: flex;
        gap: 12px;
        align-items: start;
        background: var(--info-bg);
        color: var(--info);
        padding: 16px 20px;
        border-radius: 8px;
        margin-bottom: 24px;
        font-size: 14px;
      }
      .banner.warning {
        background: var(--warning-bg);
        color: var(--warning);
      }
      .banner.danger {
        background: var(--danger-bg);
        color: var(--danger);
      }
      .banner p {
        margin-top: 4px;
      }
      .banner svg {
        margin-top: 2px;
      }
      .section {
        margin-top: 32px;
      }
      .section > h2 {
        margin-bottom: 16px;
      }
      .split {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 32px;
      }
      .context {
        border-top: 1px solid var(--border);
        padding-top: 24px;
      }
      .context dl {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 16px;
        font-size: 14px;
        margin: 20px 0 0;
      }
      .context dt {
        color: var(--muted-foreground);
      }
      .context dd {
        margin: 0;
      }
      .trail {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        padding: 20px 0;
        margin-top: 24px;
        border-block: 1px solid var(--border);
      }
      .trail span {
        min-width: 100px;
        flex: 1;
        font-size: 12px;
        color: var(--muted-foreground);
      }
      .trail b {
        display: block;
        color: var(--foreground);
        font-size: 14px;
        font-weight: 500;
      }
      .stack {
        display: grid;
        gap: 24px;
      }
      .field {
        display: grid;
        gap: 8px;
      }
      .field label {
        font-size: 14px;
        font-weight: 500;
      }
      .field small {
        font-size: 12px;
        color: var(--muted-foreground);
      }
      .field .error {
        color: var(--danger);
      }
      .field input[aria-invalid="true"] {
        border-color: var(--danger);
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }
      .specimen {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        padding: 24px 0;
        border-bottom: 1px solid var(--border);
      }
      .specimen h3 {
        min-width: 140px;
      }
      .specimen button {
        cursor: pointer;
      }
      .swatches {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 24px;
        margin-top: 20px;
      }
      .swatch {
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        background: var(--surface);
      }
      .swatch div {
        height: 64px;
        border-bottom: 1px solid var(--border);
      }
      .swatch p {
        padding: 10px 12px;
        font-size: 12px;
      }
      .swatch code {
        display: block;
        color: var(--muted-foreground);
      }
      .paper {
        background: #ffffff;
        color: #18212f;
        padding: 32px;
        border-radius: 8px;
        border: 1px solid #d5dde7;
      }
      .paper p {
        color: #536173;
      }
      .paper .paperhead {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 32px;
      }
      .paper table {
        min-width: 500px;
      }
      .paper thead {
        background: #eef2f7;
        color: #536173;
      }
      .paper th,
      .paper td {
        border-color: #d5dde7;
      }
      .paper tbody tr:hover {
        background: transparent;
      }
      .paper .badge {
        background: #e9eef5;
        color: #4e5c70;
      }
      .totals {
        max-width: 300px;
        margin-inline-start: auto;
        margin-top: 24px;
        font-size: 14px;
      }
      .totals div {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        padding: 8px 0;
      }
      .totals .grand {
        border-top: 1px solid #d5dde7;
        font-size: 20px;
        font-weight: 600;
        margin-top: 8px;
        padding-top: 16px;
      }
      .form-panel {
        padding: 24px;
        max-width: 640px;
      }
      .footer-note {
        margin-top: 32px;
        color: var(--muted-foreground);
        font-size: 12px;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      .empty {
        text-align: center;
        padding: 48px 24px;
        color: var(--muted-foreground);
      }
      dialog {
        color: var(--foreground);
        background: var(--surface);
        border: 0;
        border-radius: 16px;
        width: min(560px, calc(100vw - 32px));
        padding: 32px;
        box-shadow: 0 20px 64px rgba(0, 0, 0, 0.25);
        max-height: calc(100dvh - 32px);
        overflow: auto;
      }
      dialog::backdrop {
        background: rgba(10, 20, 32, 0.5);
      }
      dialog p {
        margin-top: 16px;
        max-width: 70ch;
        color: var(--muted-foreground);
      }
      .dialog-actions {
        display: flex;
        justify-content: end;
        margin-top: 24px;
        gap: 12px;
      }
      .sr-only {
        position: absolute;
        inset-inline-start: 0;
        top: 0;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .skip {
        position: absolute;
        inset-inline-start: 16px;
        top: -100px;
        background: var(--surface);
        padding: 12px;
        z-index: 100;
      }
      .skip:focus {
        top: 8px;
      }
      .subtle {
        color: var(--muted-foreground);
      }
      [dir="rtl"] h1 {
        letter-spacing: normal;
      }
      [dir="rtl"] body {
        line-height: 1.8;
      }
      [dir="rtl"] .forward {
        transform: scaleX(-1);
      }
      @media (min-width: 1600px) {
        main {
          padding: 48px;
        }
      }
      @media (max-width: 1400px) {
        .split {
          grid-template-columns: minmax(0, 1fr);
        }
        .context {
          max-width: none;
        }
        .context dl {
          grid-template-columns: 1fr 1fr;
        }
        .context h2 {
          margin-top: 0;
        }
      }
      @media (max-width: 1100px) {
        .shell {
          grid-template-columns: 72px minmax(0, 1fr);
        }
        aside {
          padding-inline: 8px;
        }
        .brand {
          padding: 0;
          justify-content: center;
        }
        .brandname,
        .workspace,
        nav .navlabel {
          display: none;
        }
        nav button {
          padding: 12px;
          justify-content: center;
        }
        .utilities {
          padding-inline: 24px;
        }
        .sync-label span {
          display: none;
        }
      }
      @media (max-width: 720px) {
        .referencebar {
          padding: 12px 16px;
          gap: 8px;
        }
        .ref-controls {
          margin-inline-start: 0;
          width: 100%;
          gap: 8px;
        }

        return (
          head("financeTitle", "financeLead", "reviewIssue", "issue") +
          `<div class="split"><article class="paper"><div class="paperhead"><div><h2>${t("invoice")}</h2><p>${t("numberLater")}</p></div>${badge("draft")}</div><div class="two"><div><h3>${t("seller")}</h3><p>${t("exampleSeller")}</p></div><div><h3>${t("customer")}</h3><p>${t("sampleClient")}</p></div></div><div class="two section"><p>${t("date")}<br>${dateLabel("17 Oct 2026")}</p><p>${t("currency")}<br>${num("USD")}</p></div><div class="table-scroll section" tabindex="0" role="region" aria-label="${t("invoice")}"><table><thead><tr>${["line", "qty", "price", "amount"].map((x) => `<th>${t(x)}</th>`).join("")}</tr></thead><tbody><tr><td>${t("sampleService")}</td><td class="numeric">${num("3")}</td><td class="numeric">${num("19.99")}</td><td class="numeric">${num("59.97")}</td></tr></tbody></table></div><div class="totals"><div><span>${t("subtotal")}</span>${num("USD 59.97")}</div><div><span>${t("discount")}</span>${num("−6.00")}</div><div><span>${t("tax")}</span>${num("8.10")}</div><div class="grand"><span>${t("total")}</span>${num("USD 62.07")}</div></div><p class="section smalltext">${t("calcNote")}</p></article><section class="context"><h2>${t("issueTitle")}</h2><p class="lead">${t("issueCheck")}</p><p class="section">${t("issueOnline")}</p><p class="section subtle">${t("deliverySeparate")}</p><div class="section">${badge(state === "online" ? "synced" : "localSaved", state === "online" ? "success" : "info")}</div></section></div>`
        );
      }
      function content() {
        if (view === "work" || view === "overview") return work();
        if (view === "finance") return finance();
        if (view === "projects")
          return (
            head("projectTitle", "projectLead", "newProject") +
            table(
              ["project", "client", "status", "owner", "next"],
              [
                ["atlas", "Atlas Systems", "active", "you", "acceptance"],
                [
                  "platform",
                  "North Studio",
                  "active",
                  "mona",
                  "prepareRelease",
                ],
                ["onboarding", "New client", "paused", "you", "confirmAccess"],
              ].map((a) => [
                t(a[0]),
                escape(a[1]),
                badge(a[2], a[2] === "active" ? "info" : ""),
                t(a[3]),
                `<button class="row-link" data-spec="generic">${t(a[4])}</button>`,
              ]),
            )
          );
        if (view === "clients")
          return (
            head("clientTitle", "clientLead", "newClient") +
            table(
              ["client", "contact", "languagePref"],
              [
                ["Atlas Systems", num("hello@example.test"), t("english")],
                [
                  "شركة مثال للبرمجيات",
                  num("billing@example.test"),
                  t("arabic"),
                ],
                ["North Studio", num("studio@example.test"), t("english")],
              ],
            )
          );
        if (view === "time")
          return (
            head("timeTitle", "timeLead", "addTime") +
            table(
              ["task", "project", "duration", "reviewState", "allocation"],
              [
                [
                  t("apiTask"),
                  t("atlas"),
                  num("01:30:00"),
                  badge("ready", "success"),
                  badge("reserved", "info"),
                ],
                [
                  t("releaseTask"),
                  t("platform"),
                  num("00:45:00"),
                  badge("ready", "success"),
                  badge("unallocated"),
                ],
                [
                  t("accessTask"),
                  t("onboarding"),
                  num("00:12:00"),
                  badge("needsReview", "warning"),
                  badge("unallocated"),
                ],
              ],
            ) +
            `<p class="section subtle">${t("timeNote")}</p>`
          );
        if (view === "reports")
          return (
            head("reportsTitle", "reportsLead") +
            table(
              ["metric", "value", "basis"],
              [
                [t("recorded"), num("02:27:00"), t("duration")],
                [t("reviewed"), num("02:15:00"), t("ready")],
                [t("collected"), num("USD 40.00"), t("collected")],
                [t("outstanding"), num("USD 22.07"), t("outstanding")],
              ],
            ) +
            `<p class="section subtle">${t("reportNote")}</p>`
          );
        if (view === "knowledge")
          return (
            head("knowledgeTitle", "knowledgeLead") +
            table(
              ["note", "owner", "updated"],
              ["apiNotes", "billingNotes", "localeNotes"].map((x, i) => [
                `<button class="row-link" data-spec="generic">${t(x)}</button>`,
                t("you"),
                dateLabel(`${17 - i} Oct 2026`),
              ]),
            )
          );
        if (view === "settings")
          return (
            head("settingsTitle", "settingsLead") +
            table(
              ["state", "line"],
              [
                ["personal", "personalDesc"],
                ["device", "deviceDesc"],
                ["workspaceScope", "workspaceDesc"],
              ].map((a) => [t(a[0]), t(a[1])]),
            )
          );
        if (view === "colors") {
          let colors = TOKENS.themes[document.documentElement.dataset.theme];
          return (
            head("colorsTitle", "colorsLead") +
            `<div class="swatches">${["background", "surface", "foreground", "muted-foreground", "primary", "accent", "border", "input-border", "success", "warning", "danger", "info"].map((k) => `<div class="swatch"><div style="background:${colors[k]}"></div><p><bdi dir="ltr">${k}</bdi><code>${colors[k]}</code></p></div>`).join("")}</div><section class="section stack"><h2>${t("typeTitle")}</h2><p>${t("typeBody")}</p><p class="smalltext">${t("typeLabel")}</p><p class="subtle">${t("fontNote")}</p></section>`
          );
        }
        return (
          head("componentsTitle", "componentsLead") +
          `<div class="specimen"><h3>${t("actions")}</h3><button class="primary" data-spec="generic">${t("primary")}</button><button data-spec="generic">${t("secondary")}</button><button disabled>${t("disabled")}</button></div><section class="section"><h2>${t("fields")}</h2><div class="two section"><div class="field"><label for="sample-name">${t("name")}</label><input id="sample-name" value="Atlas Systems" readonly><small>${t("fieldHint")}</small></div><div class="field"><label for="sample-email">${t("email")}</label><input id="sample-email" value="billing@" readonly aria-invalid="true" aria-describedby="email-error"><small class="error" id="email-error">${t("emailError")}</small></div></div></section><div class="specimen section"><h3>${t("statuses")}</h3>${badge("saved", "success")}${badge("pending", "info")}${badge("needsReview", "warning")}${badge("rejected", "danger")}${badge("draft")}</div><section class="section"><h2>${t("emptyTitle")}</h2><p class="lead">${t("emptyBody")}</p></section>`
        );
      }
      function render(focus = false) {
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        document
          .querySelectorAll("[data-t]")
          .forEach((el) => (el.textContent = t(el.dataset.t)));
        document
          .getElementById("menutoggle")
          .setAttribute("aria-label", t("menuOpen"));
        document
          .querySelector(".avatar")
          .setAttribute(
            "aria-label",
            lang === "ar" ? "حساب توضيحي" : "Sample account",
          );
        nav();
        document.getElementById("crumb").textContent = t(view);
        document.getElementById("crumbicon").innerHTML = icon("arrow");
        document.getElementById("timericon").innerHTML = icon("pause");
        document.getElementById("syncicon").innerHTML = icon(
          state === "online"
            ? "check"
            : state === "conflict"
              ? "alert"
              : "cloud",
        );
        document.getElementById("synctext").textContent = t(
          state === "online"
            ? "synced"
            : state === "conflict"
              ? "needsReview"
              : "localSaved",
        );
        document.getElementById("main").innerHTML =
          banner() +
          content() +
          `<div class="footer-note"><span>${t("referenceNote")}</span><a href="screens.md">${t("screenDocs")}</a></div>`;
        if (view === "work" || view === "overview") drawTaskTable();
        if (focus) document.querySelector("main h1").focus();
      }
      const media = matchMedia("(prefers-color-scheme: dark)");
      function theme() {
        let val = document.getElementById("theme").value;
        document.documentElement.dataset.theme =
          val === "system" ? (media.matches ? "dark" : "light") : val;
        if (view === "colors") render();
      }
      media.addEventListener("change", theme);
      document.getElementById("theme").onchange = theme;
      document.getElementById("language").onchange = (e) => {
        lang = e.target.value;
        render();
      };
      document.getElementById("state").onchange = (e) => {
        state = e.target.value;
        render();
      };
      let invoker;
      function specimen(type, el) {
        invoker = el;
        document.getElementById("dialogtitle").textContent = t("specTitle");
        document.getElementById("dialogbody").textContent = t(
          type === "timer"
            ? "timerBody"
            : type === "issue"
              ? "issueBody"
              : type === "conflict"
                ? "conflictSpec"
                : "specBody",
        );
        document.getElementById("specdialog").showModal();
        document.getElementById("closedialog").focus();
      }
      document.getElementById("closedialog").onclick = () =>
        document.getElementById("specdialog").close();
      document
        .getElementById("specdialog")
        .addEventListener("close", () => invoker?.focus());
      document.getElementById("menutoggle").innerHTML = icon("menu");
      document.getElementById("menutoggle").onclick = () => {
        let open = document.body.classList.toggle("nav-open");
        document
          .getElementById("menutoggle")
          .setAttribute("aria-expanded", String(open));
      };
      document.addEventListener("click", (e) => {
        let b = e.target.closest("[data-view]");
        if (b) {
          view = b.dataset.view;
          document.body.classList.remove("nav-open");
          document
            .getElementById("menutoggle")
            .setAttribute("aria-expanded", "false");
          render(true);
        }
        let s = e.target.closest("[data-spec]");
        if (s) specimen(s.dataset.spec, s);
        if (e.target.closest("#resetfilters")) {
          query = "";
          filter = "";
          render();
          document.getElementById("tasksearch").focus();
        }
      });
      document.addEventListener("input", (e) => {
        if (e.target.id === "tasksearch") {
          query = e.target.value;
          drawTaskTable();
        }
      });
      document.addEventListener("change", (e) => {
        if (e.target.id === "statusfilter") {
          filter = e.target.value;
          drawTaskTable();
        }
        if (e.target.matches("[data-select]")) {
          let id = Number(e.target.dataset.select);
          e.target.checked ? selected.add(id) : selected.delete(id);
          document.getElementById("selection").textContent = selected.size
            ? `${selected.size} ${t("selected")}`
            : "";
          document.getElementById("announce").textContent =
            document.getElementById("selection").textContent;
        }
      });
      document.querySelector(".brand").onclick = (e) => {
        e.preventDefault();
        view = "work";
        render(true);
      };
      theme();
      render();
    </script>
  </body>
</html>
